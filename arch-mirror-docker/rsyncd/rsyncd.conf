uid = nobody
gid = nobody
use chroot = yes
max connections = 50
timeout = 600
log file = /dev/stdout
transfer logging = yes
munge symlinks = no

# Already-compressed package/ISO formats: don't waste CPU trying to
# recompress them during transfer.
dont compress = *.gz *.tgz *.zip *.z *.rpm *.deb *.iso *.bz2 *.tbz *.xz *.zst *.7z

# Module name matches the convention used by upstream Tier 0/1 mirrors
# (rsync://mirror.selfnet.de/archlinux/, rsync://mirror.puzzle.ch/archlinux/)
# so downstream mirrors can point at us with the same SOURCES format.
[archlinux]
    path = /srv/archmirror
    comment = Tunisia Arch Linux Mirror (Tier 2) - mirror.safiabidi.com
    read only = yes
    exclude = stats.json
