user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  4096;
    multi_accept on;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    aio             threads;

    # Packages/ISOs are large, static, and immutable once synced - metadata
    # caching avoids a stat() per request on every directory listing / HEAD.
    open_file_cache          max=20000 inactive=5m;
    open_file_cache_valid    2m;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    keepalive_timeout  65;

    # Generous per-IP cap - big enough that a downstream mirror or a single
    # user's parallel wget/pacman never gets throttled, just stops one
    # runaway client from monopolizing the disk on this box.
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    #gzip  on;

    include /etc/nginx/conf.d/*.conf;
}
